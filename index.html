<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>매매 복기노트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231C4F8C%22/%3E%3Cpath d=%22M7 22l6-7 5 4 7-9%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 탭 바 + 한 열 작업 영역. 매매를 누르면 오른쪽에서 복기 시트가 열린다 (폰에서는 전체 화면). */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --line:#D8DEE7; --line-strong:#BAC4D2;
  --fg:#121821; --muted:#5A6577; --faint:#8A94A4;
  --accent:#1C4F8C; --accent-fg:#FFFFFF; --accent-soft:#E2EBF7;
  --up:#CC1F2A; --up-soft:#FBE7E8; --down:#1559C7; --down-soft:#E5EEFC;
  --warn:#A86612; --warn-soft:#FBF0DC;
  --shadow:0 10px 30px rgba(18,24,33,.16);
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#151B24; --surface-2:#1C2430; --line:#2A3442; --line-strong:#3A4757;
  --fg:#E6EBF2; --muted:#97A2B3; --faint:#6E7a8C;
  --accent:#86B4F2; --accent-fg:#0D1117; --accent-soft:#1B2C44;
  --up:#FF5C63; --up-soft:#3A1A1D; --down:#5E9CFF; --down-soft:#16253F;
  --warn:#E5A94B; --warn-soft:#33260F;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151B24; --surface-2:#1C2430; --line:#2A3442; --line-strong:#3A4757;
  --fg:#E6EBF2; --muted:#97A2B3; --faint:#6E7a8C;
  --accent:#86B4F2; --accent-fg:#0D1117; --accent-soft:#1B2C44;
  --up:#FF5C63; --up-soft:#3A1A1D; --down:#5E9CFF; --down-soft:#16253F;
  --warn:#E5A94B; --warn-soft:#33260F;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:20px;margin:0;letter-spacing:-.02em}
.login p{margin:0;color:var(--muted)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%}
.tabs a{padding:6px 12px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--up);border-color:var(--line)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;color:var(--muted)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
h2{font-size:18px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.section-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head .grow{margin-right:auto}

/* 요약 띠 */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.strip>div{background:var(--surface);padding:10px 14px;min-width:0}
.strip small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.strip .num{font-size:17px;font-weight:600}
@media (max-width:720px){.strip{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:last-child:nth-child(odd){grid-column:1/-1}}

/* 필터 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 160px}

/* 매매 목록 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:92px minmax(0,1.3fr) 58px 88px minmax(0,1.5fr) 110px 64px 40px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-left:3px solid transparent;font:inherit;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.win{border-left-color:var(--up)} .row.loss{border-left-color:var(--down)}
.row .date{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pnl{text-align:right;font-weight:600}
.row .r{text-align:right;font-size:12.5px}
.row .pics{color:var(--faint);font-size:12px;text-align:right}
.list-head{display:grid;grid-template-columns:92px minmax(0,1.3fr) 58px 88px minmax(0,1.5fr) 110px 64px 40px;gap:12px;padding:8px 14px 8px 17px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.list-head .rt{text-align:right}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;margin:1px 3px 1px 0}
.chip.type{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.mis{background:var(--warn-soft);color:var(--warn)}
.grade{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.row .name .grade{display:none;margin-left:4px}
.g5{background:var(--accent);color:var(--accent-fg)} .g4{background:var(--accent-soft);color:var(--accent)}
.g3{background:var(--surface-2);color:var(--muted)} .g2{background:var(--warn-soft);color:var(--warn)} .g1{background:var(--warn);color:var(--surface)}
.seg.grade-seg button[aria-pressed="true"][data-v="5"]{background:var(--accent);color:var(--accent-fg)}
.seg.grade-seg button[aria-pressed="true"][data-v="4"]{background:var(--accent-soft);color:var(--accent)}
.seg.grade-seg button[aria-pressed="true"][data-v="3"]{background:var(--surface-2);color:var(--fg)}
.seg.grade-seg button[aria-pressed="true"][data-v="2"]{background:var(--warn-soft);color:var(--warn)}
.seg.grade-seg button[aria-pressed="true"][data-v="1"]{background:var(--warn);color:var(--surface)}
.chip.todo{background:transparent;border:1px dashed var(--line-strong);color:var(--faint)}
.chip.miss{background:var(--surface-2);color:var(--fg);border:1px dashed var(--fg);font-weight:600}
.row.missed{border-left-color:var(--line-strong);border-left-style:dashed;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 11px)}
.hypo{font-style:italic;color:var(--muted)}
.import-sum{display:grid;grid-template-columns:auto auto;gap:6px 16px;margin:12px 0 16px;font-size:13.5px}
.import-sum dt{color:var(--muted)} .import-sum dd{margin:0;text-align:right;font-weight:600}
.chips{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:760px){
  .list-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name pnl" "meta r" "chips pics";gap:2px 10px}
  .row .name{grid-area:name}.row .pnl{grid-area:pnl}.row .date{grid-area:meta}.row .r{grid-area:r}
  .row .type-cell,.row .grade-cell{display:none}.row .name .grade{display:inline-block}.row .chips{grid-area:chips}.row .pics{grid-area:pics}
}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:32px 20px;text-align:center}
.empty p{margin:6px auto 16px;color:var(--muted);max-width:46ch}

/* 통계 */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.diag{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.diag b{display:block;font-size:15px;margin-bottom:2px}
.diag .tag{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--surface);border-radius:6px;padding:2px 8px;white-space:nowrap}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0}
.kv dt,.kv dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
.kv dt:first-of-type,.kv dd:first-of-type{border-top:0}
.kv dt small{display:block;color:var(--faint);font-size:11.5px;line-height:1.4}
.kv dd{text-align:right;font-weight:600}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:right}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-num);font-size:10px}

/* 오답노트 */
.mis-row{display:grid;grid-template-columns:28px minmax(0,1fr) 60px 120px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mis-row:first-child{border-top:0}
.rank{font-family:var(--font-num);font-weight:600;color:var(--warn);text-align:center}
.bar{height:6px;border-radius:9px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--down)}
.goal{background:var(--warn-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.goal small{color:var(--warn);font-weight:700;letter-spacing:.03em}
.goal b{display:block;font-size:17px;margin-top:2px}
.week{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start}
.week:first-child{border-top:0}
.ox{font-family:var(--font-num);font-weight:700;padding:1px 8px;border-radius:6px;font-size:12px}
.ox.o{background:var(--up-soft);color:var(--up)} .ox.x{background:var(--down-soft);color:var(--down)}

/* 폼 */
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;color:var(--muted);font-weight:600}
label.f>em{font-style:normal;font-size:11.5px;color:var(--faint)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid .s2{grid-column:span 2}.fgrid .s4{grid-column:1/-1}
@media (max-width:600px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.toggles button[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}

/* 복기 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100% - 48px));height:min(92vh,1100px);background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);border-radius:14px;overflow:hidden}
@media (max-width:640px){.sheet{left:0;top:0;transform:none;width:100%;height:100%;border-radius:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:16px}
.sh-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sh-col>*{flex-shrink:0}
.sh-col-h{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 -6px}
@media (min-width:1000px){
  .sheet{width:min(1400px,calc(100% - 48px))}
  .sheet-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;padding:0;overflow:hidden}
  .sh-col{overflow-y:auto;min-height:0;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
  .sh-ctx{background:var(--surface-2);border-right:1px solid var(--line)}
}
.coach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.coach-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.coach-head h3{margin:0;color:var(--fg);font-size:15px}
.coach-head .grow{margin-right:auto}
.coach-note{font-size:11.5px;color:var(--faint);margin:0 0 12px}
.coach-profile{background:var(--surface-2);border-radius:9px;padding:12px 14px;line-height:1.7;margin-bottom:14px}
.coach-profile b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.coach-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.coach-items{grid-template-columns:minmax(0,1fr)}}
.ci{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;border-left-width:4px}
.ci.warn{border-left-color:var(--warn)} .ci.info{border-left-color:var(--accent)} .ci.good{border-left-color:var(--up)}
.ci h4{margin:0 0 6px;font-size:14px;display:flex;gap:6px;align-items:baseline}
.ci .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.ci.warn .tag{background:var(--warn-soft);color:var(--warn)} .ci.info .tag{background:var(--accent-soft);color:var(--accent)} .ci.good .tag{background:var(--up-soft);color:var(--up)}
.ci .mine{font-size:13px;margin:0 0 8px}
.ci .mine::before{content:"내 기록 · ";color:var(--muted);font-weight:600}
.ci blockquote{margin:0;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:13px;line-height:1.65}
.ci .src{font-size:11px;color:var(--faint);margin-top:6px}
.seg.small button{padding:4px 10px;font-size:12px}
.ai-box{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.ai-box .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai-report{margin-top:12px;background:var(--surface-2);border-radius:10px;padding:14px 16px;line-height:1.75}
.ai-report h4{margin:14px 0 6px;font-size:14.5px}
.ai-report h4:first-child{margin-top:0}
.ai-report ul{margin:4px 0;padding-left:20px}
.ai-report p{margin:4px 0}
.ai-meta{font-size:11.5px;color:var(--faint);margin-top:8px}
.ai-hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ai-hist button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.ai-hist button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.mkt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mkt-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.mkt-head b{font-size:13px}
.mkt-head span{font-size:12px;color:var(--faint)}
.mkt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.mkt-grid{grid-template-columns:minmax(0,1fr)}}
.mkt-col{min-width:0}
.mkt-col h4{margin:0 0 4px;font-size:12px;color:var(--muted);letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px}
.mkt-close{font-size:18px;font-weight:600}
.mkt-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:6px}
.mkt-kv dt{color:var(--muted)} .mkt-kv dd{margin:0;text-align:right}
.mkt-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.mkt-flow div{background:var(--surface-2);border-radius:7px;padding:5px 8px;min-width:0}
.mkt-flow small{display:block;font-size:11px;color:var(--muted)}

];

const state = { caps: new Map(), plans: [], sectors: [], us: new Map(), fills: [], fx: new Map(), coachReports: [], coachPeriod: (() => { try { return localStorage.getItem("tj-coach-period") || "90"; } catch { return "90"; } })(), market: new Map(), trades: [], weeks: [], cfg: {...DEFAULTS}, loaded: false, readOnly: false };

const urlCache = new Map();
const api = {
  uid: () => session?.user?.id,
  async loadAll() {
    const all = async (table, cols) => {

  },
  async saveTrade(id, doc) { const { error } = await sb.from("trades").upsert({ id, user_id: api.uid(), doc, updated_at: new Date().toISOString() }); if (error) throw error; },
  async deleteTrade(id) { const { error } = await sb.from("trades").delete().eq("id", id); if (error) throw error; },

  async saveSector(id, doc) { const { error } = await sb.from("sectors").upsert({ id, user_id: api.uid(), doc, updated_at: new Date().toISOString() }); if (error) throw error; },

};
async function fillImages(root) {
  const imgs = [...root.querySelectorAll("img[data-path]")]; if (!imgs.length) return;
  const get = await api.urls(imgs.map(i => i.dataset.path));

}
function applyCfg(c) {
  state.cfg = { fee: typeof c.fee === "number" ? c.fee : DEFAULTS.fee, tax: typeof c.tax === "number" ? c.tax : DEFAULTS.tax,
    types: c.types?.length ? c.types : DEFAULTS.types, moods: c.moods?.length ? c.moods : DEFAULTS.moods, mistakes: c.mistakes?.length ? c.mistakes : DEFAULTS.mistakes,

}
async function refresh() { try { await api.loadAll(); state.loaded = true; setStatus(""); } catch (e) { setStatus("기록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.", true); } render(); if (state.loaded) setTimeout(fillMissing, 400); }
/* ---- 비어 있는 데이터를 stock 함수로 바로 채우기 (GitHub 예약 실행이 밀려도 되게) ---- */
let fillBusy = false, rerenderT = null;
const tried = new Set();
function softRender() { clearTimeout(rerenderT); rerenderT = setTimeout(() => { if (!sheet) render(); else { const d = sheet.draft; $("#sh-kind") && ($("#sh-kind").innerHTML = kindChipT(d)); markAutoSeg($("#t-kind .kind-seg"), autoKind(d)); const kh = $("#t-kind-auto"), cp = tradeCap(d); if (kh && d.name && cp != null) kh.textContent = `자동: ${autoKind(d)} (당시 시총 ${capTxt(cp)})${stockKind(d.name) && stockKind(d.name) !== autoKind(d) ? " · 직접 고른 분류가 먼저" : ""}`; renderUs(d.date, d.name, true); $("#sh-mkt") && ($("#sh-mkt").innerHTML = marketCard(d.date)); renderReview(d); } }, 300); }
function lastWeekdayBefore(kstDate) { const d = new Date(kstDate + "T00:00:00"); do d.setDate(d.getDate() - 1); while (d.getDay() === 0 || d.getDay() === 6); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
async function ensureUs(syms) {
  const kst = new Date(Date.now() + 9 * 3600e3), today = kst.toISOString().slice(0, 10);
  const want = kst.getUTCHours() >= 7 ? lastWeekdayBefore(today) : lastWeekdayBefore(lastWeekdayBefore(today));
  const stale = syms.filter(s => { const d = state.us.get(s)?.d; if (!d) return !tried.has("us:" + s); const last = Object.keys(d).sort().pop(); return last < want && !tried.has("us:" + s); });
  if (!stale.length) return false;
  stale.forEach(s => tried.add("us:" + s));

}
async function ensureCaps(list) {
  const need = new Map();
  for (const t of list) {
    if (!t.name || !/^\d{4}-\d{2}-\d{2}$/.test(t.date || "") || tradeCap(t) != null) continue;
    const k = "cap:" + t.name + "|" + t.date; if (tried.has(k)) continue;
    if (state.caps.get(t.name)?.status === "nocode") continue;
    if (!need.has(t.name)) need.set(t.name, { name: t.name, code: String(t.code || histCode(t.name) || state.caps.get(t.name)?.code || "").replace(/^A/, ""), dates: [] });
    need.get(t.name).dates.push(t.date); tried.add(k);
  }
  const items = [...need.values()]; let got = 0;
  for (let i = 0; i < items.length; i += 12) {
    const r = await callStock({ action: "caps", items: items.slice(i, i + 12) }); if (!r) break;

// 그날 시장(market_days): GitHub 예약 실행이 몇 시간씩 늦어서, 비어 있으면 stock 함수(market)로 바로 채움
async function ensureMarket(extraDates = []) {
  if (stockFn.ok === false) return false;
  const kst = new Date(Date.now() + 9 * 3600e3), today = kst.toISOString().slice(0, 10), wd = kst.getUTCDay();
  const closed = kst.getUTCHours() * 60 + kst.getUTCMinutes() >= 15 * 60 + 50;
  const latest = wd !== 0 && wd !== 6 && closed ? today : lastWeekdayBefore(today);
  const isWd = d => { const x = new Date(d + "T00:00:00").getDay(); return x !== 0 && x !== 6; };
  const want = [latest, ...extraDates, ...state.trades.map(t => t.date)].filter(d => d && /^\d{4}-\d{2}-\d{2}$/.test(d) && d <= latest && isWd(d) && !state.market.has(d));
  if (!want.length) return false;
  const oldest = want.sort()[0], key = "mkt:" + oldest; if (tried.has(key)) return false; tried.add(key);
  const days = Math.min(400, Math.ceil((new Date(today) - new Date(oldest)) / 864e5) + 3);

    const syms = [...new Set([...US_IDX.map(x => x[0]), ...Object.values(state.cfg.usMap || {}).flat()])];
    if (await ensureUs(syms)) softRender();

/* ---------- 계산 ---------- */
function calc(t, cfg = state.cfg) {
  if (t.missed) return null;  // 놓친 종목은 실제 손익 계산에서 뺌
  const b = +t.buy, s = +t.sell, q = +t.qty, st = +t.stop;
  if (!(b > 0) || !(s > 0) || !(q > 0)) return null;
  const buyAmt = b*q, sellAmt = s*q;
  const br = t.broker, actual = !!(br && br.buy === t.buy && br.sell === t.sell && br.qty === t.qty);
  const cost = actual ? br.cost : Math.round(buyAmt*cfg.fee) + Math.round(sellAmt*cfg.fee) + Math.round(sellAmt*cfg.tax);
  const pnl = actual ? br.pnl : sellAmt - buyAmt - cost;
  const R = (st > 0 && st < b) ? pnl / ((b - st) * q) : null;
  return { buyAmt, sellAmt, cost, pnl, ret: pnl / buyAmt, R, win: pnl > 0, actual };

}

      }

      if ((p.note || "").trim()) text(p.note.trim(), "400", 21, "#121821", 1.6);
      y += 14;

    y += 28;
  }
  page();
  return pdf.output("blob");
}

    const ins = await sb.from("coach_reports").insert(row).select("id, created_at, model, period, text").single();

/* ---------- 매매 시트 (복기카드) ---------- */
function parseNum(v) {
  const s = String(v ?? "").replace(/,/g, "").trim(); if (!s) return null;
  const m = s.match(/^(\d+(?:\.\d+)?)\s*([\/*])\s*(\d+(?:\.\d+)?)$/);
  if (m) { const a = +m[1], b = +m[3]; const r = m[2] === "/" ? (b ? a/b : null) : a*b; return r == null ? null : Math.round(r*100)/100; }
  const n = Number(s); return isFinite(n) ? n : null;
}

    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 3200 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*scale); cv.height = Math.round(bmp.height*scale);

    const qty = xnum(b[C.qty]), price = xnum(b[C.price]), time = xtime(b[C.time]), date = xdate(b[C.date]);
    const kind = String(a[C.kind] ?? "");
    if (!qty || !price || !time || !date || /취소|정정/.test(String(b[C.cancel] ?? ""))) { skipped++; continue; }
    const side = kind.includes("매수") ? "buy" : kind.includes("매도") ? "sell" : null; if (!side) { skipped++; continue; }
    const order = xnum(a[C.order]);
    out.push({ key: `${date}|${order}`, date, time, order, code: String(a[C.code] ?? "").trim(), name: String(b[C.name] ?? "").trim(), side, qty, price,
      ex: String(b[C.ex] ?? "").trim(), credit: /신용/.test(kind + String(b[C.credit] ?? "")) });
  }
  return { out, skipped };
}
async function parseHero(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
  const fr = parseFillsRows(rows); if (fr) return { fills: fr.out, fillSkipped: fr.skipped, out: [], buyOnly: 0 };
  const hi = rows.findIndex(r => r && r.some(c => String(c ?? "").includes("거래일")) && r.some(c => String(c ?? "").includes("종목명")));
  if (hi < 0) throw new Error("format");
  const out = []; let buyOnly = 0;
  for (const r of rows.slice(hi + 1)) {
    if (!r) continue; const date = xdate(r[1]); if (!date) continue;
    const code = String(r[2] ?? "").trim(), name = String(r[3] ?? "").trim();
    const sq = xnum(r[9]), sa = xnum(r[10]), fee = xnum(r[12]) || 0, pnl = xnum(r[13]);
    if (!sq || !sa || pnl == null) { buyOnly++; continue; }
    const buy = Math.round(((sa - fee - pnl) / sq) * 100) / 100, sell = Math.round((sa / sq) * 100) / 100;
    out.push({ date, code, name, buy, sell, qty: sq,
      broker: { buy, sell, qty: sq, pnl, cost: Math.round(sa - buy * sq - pnl) },
      importKey: `${date}|${code}|${sq}|${sa}` });
  }
  return { out, buyOnly };
}
$("#importBtn").onclick = () => $("#importFile").click();
async function importFills(fills) {
  const have = new Set(state.fills.map(f => f.key)), seen = new Set();
  const fresh = fills.filter(f => !have.has(f.key) && !seen.has(f.key) && seen.add(f.key));
  const dates = [...new Set(fills.map(f => f.date))].sort();
  const names = new Set(state.trades.map(t => t.date + "|" + t.name));
  const fx = buildFx([...state.fills, ...fresh]);
  const matched = [...fx.keys()].filter(k => names.has(k)).length;
  const w = document.createElement("div"); w.className = "modal-wrap";
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:440px"><h2>체결 내역 가져오기</h2>
    <dl class="import-sum">
      <dt>체결 건수</dt><dd class="num">${fills.length}건</dd>
      <dt>기간</dt><dd class="num">${dates[0]} ~ ${dates[dates.length - 1]}</dd>
      <dt>새로 추가</dt><dd class="num">${fresh.length}건</dd>
      <dt>이미 있어서 건너뜀</dt><dd class="num">${fills.length - fresh.length}건</dd>
      <dt>매매 기록과 연결되는 매매</dt><dd class="num">${matched}건</dd>
    </dl>
    <p>체결 시각으로 진입·청산 시간, 보유 시간, 물타기·불타기를 자동으로 계산해요. 아직 다 팔지 않은 종목은 판 날 체결이 들어오면 이어져요.</p>
    <div class="acts"><button class="btn" type="button" data-a="no">취소</button><button class="btn primary" type="button" data-a="yes" ${fresh.length ? "" : "disabled"}>${fresh.length}건 가져오기</button></div></div>`;
  document.body.appendChild(w);
  w.addEventListener("click", async ev => {
    if (ev.target === w) return w.remove();
    const a = ev.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "no") return w.remove();
    a.disabled = true; a.textContent = "가져오는 중…";
    try {
      const uid = api.uid();
      const rows = fresh.map(f => ({ key: f.key, user_id: uid, doc: f }));
      for (let i = 0; i < rows.length; i += 500) { const { error } = await sb.from("fills").upsert(rows.slice(i, i + 500)); if (error) throw error; }
      w.remove(); toast(`체결 ${rows.length}건을 가져왔어요`); await refresh();
    } catch (err) {
      a.disabled = false; a.textContent = "다시 시도";
      toast(/fills|relation|schema/i.test(err?.message || "") ? "Supabase에 fills 표를 먼저 만들어 주세요" : errMsg(err));
    }
  });
}
$("#importFile").onchange = async e => {
  const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
  let all = [], buyOnly = 0, badFiles = [], fills = [];
  for (const f of files) { try { const r = await parseHero(f); all.push(...r.out); buyOnly += r.buyOnly; if (r.fills) fills.push(...r.fills); } catch { badFiles.push(f.name); } }
  if (fills.length && !all.length && !badFiles.length) return importFills(fills);
  const have = new Set(state.trades.map(t => t.importKey).filter(Boolean)), seen = new Set(); let dup = 0;
  const fresh = all.filter(t => { if (have.has(t.importKey) || seen.has(t.importKey)) { dup++; return false; } seen.add(t.importKey); return true; });
  const dates = fresh.map(t => t.date).sort();
  const w = document.createElement("div"); w.className = "modal-wrap";
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:420px"><h2>영웅문 내역 가져오기</h2>
    ${badFiles.length ? `<p class="down">읽지 못한 파일: ${esc(badFiles.join(", "))}<br>영웅문 매매 내역(거래일·종목명·매수·매도 칸이 있는 표)을 엑셀로 저장한 파일인지 확인해 주세요.</p>` : ""}
    <dl class="import-sum">
      <dt>새로 추가할 매매</dt><dd class="num">${fresh.length}건</dd>
      ${dates.length ? `<dt>기간</dt><dd class="num">${dates[0]} ~ ${dates[dates.length-1]}</dd>` : ""}
      <dt>이미 있어서 건너뜀</dt><dd class="num">${dup}건</dd>
      <dt>매수만 있는 줄 (팔 때 반영)</dt><dd class="num">${buyOnly}줄</dd>
    </dl>
    <p>손익은 영웅문이 계산한 실제 금액 그대로 들어가요. 진입근거·사진·실수유형은 나중에 매매를 눌러 채우면 돼요.</p>
    <div class="acts"><button class="btn" type="button" data-a="no">취소</button><button class="btn primary" type="button" data-a="yes" ${fresh.length ? "" : "disabled"}>${fresh.length}건 가져오기</button></div></div>`;
  document.body.appendChild(w);
  w.addEventListener("click", async ev => {
    if (ev.target === w) return w.remove();
    const a = ev.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "no") return w.remove();
    a.disabled = true; a.textContent = "가져오는 중…";
    try {
      const now = Date.now(), uid = api.uid();
      const rows = fresh.map((t, i) => ({ id: crypto.randomUUID(), user_id: uid, updated_at: new Date().toISOString(),
        doc: { ...t, type: "", mood: "", reason: "", stop: null, stopKept: "", mistakes: [], memo: "", lesson: "", photos: [], imported: true, createdAt: now + i, updatedAt: now } }));
      for (let i = 0; i < rows.length; i += 200) { const { error } = await sb.from("trades").insert(rows.slice(i, i + 200)); if (error) throw error; }
      w.remove(); toast(`${rows.length}건을 가져왔어요`); await refresh();
    } catch (err) { a.disabled = false; a.textContent = "다시 시도"; toast(errMsg(err)); }
  });
};

function render() {
  const n = state.trades.filter(t => !t.missed).length, nm = state.trades.length - n;
  $("#countLabel").textContent = state.loaded ? `매매 ${n}건 기록됨${nm ? ` · 놓친 종목 ${nm}건` : ""}` : "기록을 불러오는 중";
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "log";
  if (v === "log") renderLog(); if (v === "stats") renderStats(); if (v === "notes") renderNotes(); if (v === "sectors") renderSectors(); if (v === "plan") renderPlanView(true); if (v === "week") renderWeek(true); if (v === "setup") renderSetup();
}

/* ---------- 로그인 · 데이터 연결 ---------- */
function showApp(on) { $("#loginView").hidden = on; $("#appView").hidden = !on; }
async function boot() {
  const cfg = window.TJ_CONFIG || {};
  if (!window.supabase || !cfg.url || !cfg.anonKey || cfg.url.includes("YOUR_")) {
    showApp(false); $("#loginMsg").textContent = "아직 저장소가 연결되지 않았어요. config.js에 Supabase 주소와 키를 넣어 주세요.";
    $("#lg-go").disabled = true; $("#lg-signup").disabled = true; return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((_e, s) => {
    const was = !!session; session = s;
    if (!!s !== was) { if (s) { showApp(true); route(); refresh(); } else { state.trades = []; state.weeks = []; state.loaded = false; sheet = null; $("#layer").innerHTML = ""; showApp(false); } }
  });
  if (session) { showApp(true); route(); await refresh(); } else showApp(false);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const email = $("#lg-email").value.trim(), password = $("#lg-pw").value;
  $("#lg-go").disabled = true; $("#loginMsg").textContent = "로그인하는 중…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("#lg-go").disabled = false;
  if (error) $("#loginMsg").textContent = /confirm/i.test(error.message) ? "이메일 인증을 먼저 해주세요. 메일함을 확인하세요." : "이메일이나 비밀번호가 맞지 않아요.";
};
$("#lg-signup").onclick = async () => {
  const email = $("#lg-email").value.trim(), password = $("#lg-pw").value;
  if (!email || password.length < 8) { $("#loginMsg").textContent = "이메일과 8자 이상 비밀번호를 적고 다시 눌러 주세요."; return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { $("#loginMsg").textContent = /not allowed|disabled/i.test(error.message) ? "새 계정은 만들 수 없게 막혀 있어요." : "계정을 만들지 못했어요: " + error.message; return; }
  $("#loginMsg").textContent = data.session ? "계정을 만들었어요." : "인증 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인하세요.";
};
boot();
