name: 시장 데이터 기록

on:
  schedule:
    - cron: "20 8 * * 1-5"   # 평일 17:20 (한국 시간)
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 가져올지 (1년치는 400)"
        default: "7"
      dry_run:
        description: "저장하지 않고 확인만"
        type: boolean
        default: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시장 데이터 가져와서 저장
        env:
          SUPABASE_URL: https://qayneaypdazflrvwcphs.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/market.py --days "${{ inputs.days || '7' }}" ${{ inputs.dry_run && '--dry-run' || '' }}
