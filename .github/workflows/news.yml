name: 종목 뉴스 기록

on:
  schedule:
    - cron: "10 * * * *"   # 매시 10분
  workflow_dispatch:
    inputs:
      test:
        description: "확인만: '종목코드또는이름 날짜' (예: 005930 2026-11-20). 비우면 평소처럼 실행"
        default: ""
      force:
        description: "이미 가져온 것도 전부 다시"
        type: boolean
        default: false
      dry_run:
        description: "저장하지 않고 확인만"
        type: boolean
        default: false

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 가져와서 저장
        env:
          SUPABASE_URL: https://qayneaypdazflrvwcphs.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TEST: ${{ inputs.test }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$TEST" ]; then python scripts/news.py --test $TEST; exit 0; fi
          python scripts/news.py ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
