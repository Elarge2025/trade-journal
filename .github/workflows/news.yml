name: 종목 뉴스 기록

on:
  schedule:
    - cron: "10 * * * *"   # 매시 10분: 참고한 기사 본문 + 종목 뉴스
    - cron: "40 * * * *"   # 매시 40분: 참고한 기사 본문만
  workflow_dispatch:
    inputs:
      test:
        description: "확인만: '종목코드또는이름 날짜' (예: 005930 2026-11-20) 또는 기사 주소, 또는 'us 티커'(예: us TSLA). 비우면 평소처럼 실행"
        default: ""
      force:
        description: "이미 가져온 것도 전부 다시"
        type: boolean
        default: false
      dry_run:
        description: "저장하지 않고 확인만"
        type: boolean
        default: false

concurrency:
  group: news-${{ github.event.schedule == '40 * * * *' && 'articles' || 'main' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 미국 시세 (지수·종목별 관련주)
        continue-on-error: true
        env:
          SUPABASE_URL: https://qayneaypdazflrvwcphs.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TEST: ${{ inputs.test }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "$TEST" == us\ * ]]; then python scripts/us.py --test "${TEST#us }"; exit 0; fi
          if [ -n "$TEST" ]; then exit 0; fi
          python scripts/us.py
      - name: 뉴스 가져와서 저장
        env:
          SUPABASE_URL: https://qayneaypdazflrvwcphs.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TEST: ${{ inputs.test }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "$TEST" == us\ * ]]; then exit 0; fi
          if [[ "$TEST" == http* ]]; then python scripts/news.py --article "$TEST"; exit 0; fi
          if [ -n "$TEST" ]; then python scripts/news.py --test $TEST; exit 0; fi
          if [ "${{ github.event.schedule }}" = "40 * * * *" ]; then python scripts/news.py --articles-only; exit 0; fi
          python scripts/news.py ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
