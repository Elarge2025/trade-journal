name: AI 코치 배포

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-coach.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qayneaypdazflrvwcphs
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.54.11
      - name: 키 확인
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::GitHub Secrets에 SUPABASE_ACCESS_TOKEN이 없어서 배포를 건너뛰어요"
      - name: AI 키 등록
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"; else echo "::warning::ANTHROPIC_API_KEY가 없어서 AI 분석은 아직 안 돼요"; fi
      - name: 함수 배포
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy coach --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
